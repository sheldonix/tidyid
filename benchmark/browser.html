<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>TidyID browser benchmark</title>
  <pre id="output">Running…</pre>
  <script type="module">
    import { nanoid } from '/node_modules/nanoid/index.browser.js';
    import { tidyid } from '/dist/index.browser.js';

    const lengths = [8, 10, 16, 64];
    const warmupCalls = 20_000;
    const sampleCalls = 5_000;
    const sampleCount = 50;

    function percentile(sorted, value) {
      return sorted[Math.ceil(sorted.length * value) - 1];
    }

    function measure(generate) {
      let checksum = 0;
      for (let call = 0; call < warmupCalls; call += 1) {
        checksum ^= generate().charCodeAt(0);
      }
      const samples = new Array(sampleCount);
      const started = performance.now();
      for (let sample = 0; sample < sampleCount; sample += 1) {
        const sampleStarted = performance.now();
        for (let call = 0; call < sampleCalls; call += 1) {
          checksum ^= generate().charCodeAt(0);
        }
        samples[sample] = performance.now() - sampleStarted;
      }
      const duration = performance.now() - started;
      samples.sort((left, right) => left - right);
      return {
        opsPerSecond: Math.round(
          sampleCalls * sampleCount * 1_000 / duration,
        ),
        p50Nanoseconds: Math.round(
          percentile(samples, 0.50) * 1_000_000 / sampleCalls,
        ),
        p95Nanoseconds: Math.round(
          percentile(samples, 0.95) * 1_000_000 / sampleCalls,
        ),
        p99Nanoseconds: Math.round(
          percentile(samples, 0.99) * 1_000_000 / sampleCalls,
        ),
        checksum,
      };
    }

    const results = {
      userAgent: navigator.userAgent,
      warmupCalls,
      measuredCalls: sampleCalls * sampleCount,
      lengths: lengths.map(length => ({
        length,
        tidyid: measure(() => tidyid(length)),
        nanoid: measure(() => nanoid(length)),
      })),
    };
    globalThis.benchmarkResults = results;
    document.querySelector('#output').textContent = JSON.stringify(
      results,
      null,
      2,
    );
  </script>
</html>
