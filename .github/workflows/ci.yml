name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - if: matrix.node == 24
        run: npm run benchmark:memory
      - if: matrix.node == 24
        name: Audit npm tarball
        run: |
          mkdir -p .pack-output
          npm pack --ignore-scripts --pack-destination .pack-output
          node scripts/check-package.mjs ".pack-output/tidyid-$(node -p "require('./package.json').version").tgz"

  browsers:
    name: Browser matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run benchmark:browser
