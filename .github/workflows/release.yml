name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      stage:
        description: Stage on npm after all checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - if: ${{ github.event_name == 'push' || inputs.stage }}
        name: Verify release tag
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$expected"
      - run: mkdir -p .pack-output
      - run: npm pack --ignore-scripts --pack-destination .pack-output
      - name: Audit npm tarball
        run: node scripts/check-package.mjs ".pack-output/tidyid-$(node -p "require('./package.json').version").tgz"
      - if: ${{ github.event_name == 'workflow_dispatch' && !inputs.stage }}
        run: npm publish ".pack-output/tidyid-$(node -p "require('./package.json').version").tgz" --dry-run
      - if: ${{ github.event_name == 'push' || inputs.stage }}
        run: npm stage publish ".pack-output/tidyid-$(node -p "require('./package.json').version").tgz"
